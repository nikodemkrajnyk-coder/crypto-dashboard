<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WMBOT">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WMBOT // crypto</title>
<style>
  :root{ --g:#00ff66; --gd:#0a3; --dim:#063; --bg:#000; --warn:#ffb300; --red:#ff4455; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--g);font-family:"SFMono-Regular",Menlo,Consolas,monospace;
       overflow-x:hidden;-webkit-font-smoothing:none}
  canvas#rain{position:fixed;inset:0;z-index:0;opacity:.28}
  .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:18px 14px 48px}
  .hdr{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--dim);padding-bottom:8px;margin-bottom:14px}
  .hdr h1{font-size:15px;letter-spacing:3px;text-shadow:0 0 8px var(--g)}
  .hdr .t{font-size:10px;color:var(--gd)}
  .blink{animation:b 1.1s steps(2) infinite}@keyframes b{50%{opacity:0}}
  .card{border:1px solid var(--dim);border-radius:6px;padding:12px 13px;margin-bottom:12px;
        background:rgba(0,20,8,.55);box-shadow:0 0 14px rgba(0,255,102,.07) inset}
  .card h2{font-size:11px;letter-spacing:2px;color:var(--g);margin-bottom:10px;text-shadow:0 0 6px var(--g)}
  .card h2 .tag{float:right;font-size:9px;padding:1px 6px;border:1px solid var(--dim);border-radius:3px;color:var(--gd)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cell{border:1px solid #052;border-radius:4px;padding:8px}
  .cell .k{font-size:9px;color:var(--gd);letter-spacing:1px}
  .cell .v{font-size:20px;margin-top:3px;text-shadow:0 0 8px var(--g)}
  .v.pos{color:var(--g)} .v.neg{color:var(--red);text-shadow:0 0 8px var(--red)}
  .bar{height:7px;border:1px solid var(--dim);border-radius:4px;margin-top:10px;overflow:hidden;background:#010}
  .bar i{display:block;height:100%;background:var(--g);box-shadow:0 0 10px var(--g)}
  .log{font-size:10px;line-height:1.6;color:var(--gd);margin-top:6px;max-height:150px;overflow:auto}
  .log div:before{content:"> ";color:var(--g)}
  .foot{text-align:center;font-size:9px;color:#042;margin-top:16px;letter-spacing:1px}
  .err{color:var(--warn)}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <div class="hdr">
    <h1>WESTMERE // CRYPTO<span class="blink">_</span></h1>
    <div class="t" id="updated">SYNCING…</div>
  </div>

  <div class="card">
    <h2>ACCUMULATION ENGINE <span class="tag" id="acc-mode">—</span></h2>
    <div class="grid">
      <div class="cell"><div class="k">WEEKLY BUDGET</div><div class="v" id="acc-weekly">£—</div></div>
      <div class="cell"><div class="k">COINS</div><div class="v" id="acc-coins" style="font-size:13px">—</div></div>
    </div>
    <div class="log" id="acc-status"></div>
  </div>

  <div class="card">
    <h2>DAY-TRADE SLEEVE <span class="tag" id="dt-mode">PAPER</span></h2>
    <div class="grid">
      <div class="cell"><div class="k">NET P/L (PAPER)</div><div class="v" id="dt-pnl">£—</div></div>
      <div class="cell"><div class="k">WIN RATE</div><div class="v" id="dt-wr">—</div></div>
      <div class="cell"><div class="k">TRADES</div><div class="v" id="dt-trades">—</div></div>
      <div class="cell"><div class="k">ETH-GBP</div><div class="v" id="dt-price" style="font-size:16px">£—</div></div>
    </div>
    <div class="k" style="margin-top:10px">POT DEPLOYED <span id="dt-potlbl"></span></div>
    <div class="bar"><i id="dt-potbar" style="width:0%"></i></div>
    <div class="log" id="dt-log"></div>
  </div>

  <div class="foot" id="foot">WMBOT TERMINAL · PAPER MODE · NO REAL FUNDS AT RISK</div>
</div>

<script>
// ---- Matrix rain ----
const c=document.getElementById('rain'),x=c.getContext('2d');
let cols,drops;const glyph="アカサタナハマヤラ0123456789ABCDEF<>/#$".split("");
function size(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/14);drops=Array(cols).fill(1)}
size();addEventListener('resize',size);
function draw(){x.fillStyle="rgba(0,0,0,.08)";x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#00ff66";x.font="14px monospace";
  for(let i=0;i<cols;i++){const t=glyph[Math.floor(Math.random()*glyph.length)];
    x.fillText(t,i*14,drops[i]*14);
    if(drops[i]*14>c.height&&Math.random()>.975)drops[i]=0;drops[i]++}}
setInterval(draw,60);

// ---- data ----
const gbp=n=>(n<0?"-£":"£")+Math.abs(Number(n)).toLocaleString('en-GB',{maximumFractionDigits:2});
async function load(){
  try{
    const r=await fetch('stats.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0; const d=await r.json();
    const up=new Date(d.updated);
    document.getElementById('updated').textContent='SYNC '+up.toISOString().slice(5,16).replace('T',' ')+'Z';
    // accumulation
    const a=d.accumulation||{};
    document.getElementById('acc-mode').textContent=(a.mode||'offline').toUpperCase();
    document.getElementById('acc-weekly').textContent=gbp(a.weekly_gbp||0);
    document.getElementById('acc-coins').textContent=a.assets?Object.keys(a.assets).map(k=>k.split('-')[0]).join(' '):'—';
    document.getElementById('acc-status').innerHTML='<div>'+(a.status||'standing by')+'</div>';
    // daytrade
    const t=d.daytrade||{};
    document.getElementById('dt-mode').textContent=(t.mode||'paper').toUpperCase();
    const pnl=document.getElementById('dt-pnl');pnl.textContent=gbp(t.realized_pnl_gbp||0);
    pnl.className='v '+((t.realized_pnl_gbp||0)<0?'neg':'pos');
    document.getElementById('dt-wr').textContent=t.trades?Math.round((t.win_rate||0)*100)+'%':'—';
    document.getElementById('dt-trades').textContent=t.trades??'—';
    document.getElementById('dt-price').textContent=t.last_price?gbp(t.last_price):'£—';
    const dep=(t.invested_gbp||0),pot=(t.pot_gbp||20),pct=Math.min(100,Math.round(dep/pot*100));
    document.getElementById('dt-potbar').style.width=pct+'%';
    document.getElementById('dt-potlbl').textContent=gbp(dep)+' / '+gbp(pot)+'  ('+(t.tranches_open||0)+'/'+(t.tranches_total||4)+' slots)';
    const log=document.getElementById('dt-log');
    log.innerHTML=(t.journal&&t.journal.length?t.journal:['awaiting first run…']).slice(-8).map(l=>'<div>'+String(l).replace(/[<>]/g,'')+'</div>').join('');
  }catch(e){
    document.getElementById('updated').innerHTML='<span class="err">NO SIGNAL — awaiting first bot run</span>';
  }
}
load();setInterval(load,60000);
</script>
</body>
</html>
