<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WMBOT">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WMBOT // crypto</title>
<style>
  :root{ --g:#00ff66; --gd:#0c4; --dim:#063; --bg:#000; --warn:#ffb300; --red:#ff4455;
         --pad:clamp(10px,2.2vw,28px); --gap:clamp(10px,1.6vw,20px); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--bg)}
  body{color:var(--g);font-family:"SFMono-Regular",Menlo,Consolas,monospace;overflow-x:hidden;
       -webkit-font-smoothing:none;font-size:clamp(13px,1.15vw,17px)}
  canvas#rain{position:fixed;inset:0;z-index:0;opacity:.28;width:100vw;height:100vh}

  /* full-bleed shell: fills the viewport (incl. MacBook widths), caps at 1600px only on big external monitors */
  .wrap{position:relative;z-index:1;width:100%;max-width:1600px;margin:0 auto;min-height:100vh;min-height:100dvh;
        padding:calc(var(--pad) + env(safe-area-inset-top)) calc(var(--pad) + env(safe-area-inset-right))
                calc(var(--pad) + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
        display:flex;flex-direction:column;gap:var(--gap)}
  .hdr{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;
       border-bottom:1px solid var(--dim);padding-bottom:10px}
  .hdr h1{font-size:clamp(17px,2.2vw,30px);letter-spacing:.2em;text-shadow:0 0 10px var(--g)}
  .hdr .t{font-size:clamp(11px,1vw,14px);color:var(--gd)}
  .blink{animation:b 1.1s steps(2) infinite}@keyframes b{50%{opacity:0}}

  .main{flex:1;display:grid;gap:var(--gap);grid-template-columns:1fr;grid-template-areas:"feed" "acc" "dt";min-height:0}
  @media (min-width:900px){
    .main{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:auto 1fr;grid-template-areas:"acc feed" "dt feed"}
  }
  .card{border:1px solid var(--dim);border-radius:8px;padding:clamp(12px,1.4vw,20px);min-width:0;
        background:rgba(0,20,8,.6);box-shadow:0 0 18px rgba(0,255,102,.08) inset;display:flex;flex-direction:column}
  .card h2{font-size:clamp(12px,1.05vw,15px);letter-spacing:.18em;margin-bottom:12px;text-shadow:0 0 6px var(--g);
           display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tag{font-size:.75em;padding:2px 8px;border:1px solid var(--dim);border-radius:3px;color:var(--gd);letter-spacing:.1em}
  #acc{grid-area:acc} #dt{grid-area:dt} #feed{grid-area:feed}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
  .cell{border:1px solid #052;border-radius:5px;padding:clamp(8px,1vw,14px)}
  .cell .k{font-size:.72em;color:var(--gd);letter-spacing:.12em}
  .cell .v{font-size:clamp(20px,2.3vw,34px);margin-top:4px;text-shadow:0 0 8px var(--g);overflow-wrap:anywhere}
  .v.pos{color:var(--g)} .v.neg{color:var(--red);text-shadow:0 0 8px var(--red)}
  .k{font-size:.72em;color:var(--gd);letter-spacing:.12em}
  .bar{height:9px;border:1px solid var(--dim);border-radius:5px;margin-top:8px;overflow:hidden;background:#010}
  .bar i{display:block;height:100%;width:0;background:var(--g);box-shadow:0 0 10px var(--g);transition:width .8s}
  .log{font-size:.8em;line-height:1.65;color:var(--gd);margin-top:10px;overflow:auto;max-height:12em}
  .log div:before{content:"> ";color:var(--g)}

  /* neural feed */
  #feed{min-height:55vh}
  @media (min-width:900px){#feed{min-height:0}}
  .pulse{width:.6em;height:.6em;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);display:inline-block;
         margin-right:.5em;animation:p 1.6s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.7)}}
  .hb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .hb .cell .v{font-size:clamp(15px,1.7vw,24px)}
  .stream{flex:1;min-height:14em;overflow-y:auto;border:1px solid #052;border-radius:5px;padding:12px;
          background:rgba(0,8,3,.75);font-size:clamp(12px,1.05vw,15px);line-height:1.7;scroll-behavior:smooth}
  .stream .ln{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--gd)}
  .stream .ln.new{color:var(--g);text-shadow:0 0 6px var(--g)}
  .stream .ln .p{color:var(--dim)}
  .rows{margin-top:12px;display:grid;gap:4px;font-size:.85em}
  .row{display:grid;grid-template-columns:3.6em minmax(0,1fr) minmax(0,1fr) 5.2em 3.4em;gap:8px;padding:6px 8px;
       border:1px solid #052;border-radius:4px;align-items:baseline;font-variant-numeric:tabular-nums}
  .row.dt{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 5.2em minmax(0,1fr)}
  .row.h{border:none;padding:0 8px;color:var(--gd);font-size:.78em;letter-spacing:.1em}
  .row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .r{text-align:right} .row .full{grid-column:1/-1}
  .up{color:var(--g);text-shadow:0 0 6px var(--g)} .dn{color:var(--red);text-shadow:0 0 6px var(--red)} .mute{color:var(--dim)}
  .guard{margin-top:10px;padding:6px 10px;border:1px solid var(--dim);border-radius:4px;font-size:.78em;
         letter-spacing:.1em;color:var(--gd)}
  .guard.on{border-color:var(--warn);color:var(--warn);text-shadow:0 0 8px var(--warn);animation:b 1.4s steps(2) infinite}
  .cur{display:inline-block;width:.6em;height:1.1em;vertical-align:text-bottom;background:var(--g);
       box-shadow:0 0 8px var(--g);animation:b 1s steps(2) infinite}
  .foot{text-align:center;font-size:.7em;color:#073;letter-spacing:.12em}
  .err{color:var(--warn)}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <div class="hdr">
    <h1>WESTMERE // CRYPTO<span class="blink">_</span></h1>
    <div class="t" id="updated">SYNCING…</div>
  </div>

  <div class="main">
    <div class="card" id="feed">
      <h2><span><span class="pulse"></span>NEURAL FEED // LIVE</span><span class="tag" id="feed-mode">PAPER</span></h2>
      <div class="hb">
        <div class="cell"><div class="k">LAST SYNC</div><div class="v" id="hb-sync">—</div></div>
        <div class="cell"><div class="k">SYNC AGE</div><div class="v" id="hb-age">—</div></div>
        <div class="cell"><div class="k">NEXT RUN IN</div><div class="v" id="hb-next">--:--</div></div>
      </div>
      <div class="stream" id="stream"><div class="ln" id="cursor-line"><span class="cur"></span></div></div>
    </div>

    <div class="card" id="acc">
      <h2>ACCUMULATION ENGINE <span class="tag" id="acc-mode">—</span></h2>
      <div class="grid">
        <div class="cell"><div class="k">UNREALISED P/L (WEIGHTED)</div><div class="v" id="acc-pnl">—</div></div>
        <div class="cell"><div class="k">BUYS FILLED</div><div class="v" id="acc-buys">—</div></div>
      </div>
      <div class="rows" id="acc-rows"></div>
      <div class="log" id="acc-status"></div>
    </div>

    <div class="card" id="dt">
      <h2>DAY-TRADE SLEEVE <span class="tag" id="dt-mode">PAPER</span></h2>
      <div class="grid">
        <div class="cell"><div class="k">NET P/L AFTER FEES</div><div class="v" id="dt-pnl">£—</div></div>
        <div class="cell"><div class="k">GROSS P/L</div><div class="v" id="dt-gross">£—</div></div>
        <div class="cell"><div class="k">WIN RATE</div><div class="v" id="dt-wr">—</div></div>
        <div class="cell"><div class="k">TRADES CLOSED</div><div class="v" id="dt-trades">—</div></div>
      </div>
      <div class="k" style="margin-top:12px"><span id="dt-pair">ETH-GBP</span> <span id="dt-price">£—</span> · <span id="dt-potlbl"></span></div>
      <div class="bar"><i id="dt-potbar"></i></div>
      <div class="k" style="margin-top:10px" id="dt-fees"></div>
      <div class="rows" id="dt-rows"></div>
      <div class="guard" id="dt-guard" hidden></div>
      <div class="log" id="dt-log"></div>
    </div>
  </div>

  <div class="foot" id="foot">WMBOT TERMINAL</div>
</div>

<script>
// ---- Matrix rain ----
const c=document.getElementById('rain'),x=c.getContext('2d');
let cols,drops;const glyph="アカサタナハマヤラ0123456789ABCDEF<>/#$".split("");
function size(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/14);drops=Array(cols).fill(1)}
size();addEventListener('resize',size);
function draw(){x.fillStyle="rgba(0,0,0,.08)";x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#00ff66";x.font="14px monospace";
  for(let i=0;i<cols;i++){const t=glyph[Math.floor(Math.random()*glyph.length)];
    x.fillText(t,i*14,drops[i]*14);
    if(drops[i]*14>c.height&&Math.random()>.975)drops[i]=0;drops[i]++}}
setInterval(draw,60);

const $=id=>document.getElementById(id);
const gbp=n=>(n<0?"-£":"£")+Math.abs(Number(n)).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctf=n=>n==null?'—':(n>0?'+':'')+(n*100).toFixed(2)+'%';
const pcls=n=>n==null?'mute':n>0?'up':n<0?'dn':'';
const pxf=n=>n==null?'—':'£'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:n<100?5:2});
function row(cells,cls){const r=document.createElement('div');r.className='row'+(cls?' '+cls:'');
  for(const [t,c] of cells){const s=document.createElement('span');s.textContent=t;if(c)s.className=c;r.append(s)}return r}

// ---- neural feed: typewriter stream ----
const stream=$('stream'),cursorLine=$('cursor-line');
const shown=new Set(),queue=[];let typing=false;
function enqueue(lines){
  for(const l of lines){const s=String(l);if(!shown.has(s)){shown.add(s);queue.push(s)}}
  if(!typing)typeNext();
}
function typeNext(){
  const s=queue.shift();if(s===undefined){typing=false;return}
  typing=true;
  stream.querySelectorAll('.ln.new').forEach(e=>e.classList.remove('new'));
  const ln=document.createElement('div');ln.className='ln new';
  const pfx=document.createElement('span');pfx.className='p';pfx.textContent='> ';
  const txt=document.createElement('span');ln.append(pfx,txt);
  stream.insertBefore(ln,cursorLine);
  const fast=queue.length>6;let i=0;          // catch up quickly on a big backlog
  (function tick(){
    i+=fast?3:1;txt.textContent=s.slice(0,i);stream.scrollTop=stream.scrollHeight;
    if(i<s.length)setTimeout(tick,fast?6:18+Math.random()*30);
    else setTimeout(typeNext,fast?60:280);
  })();
  while(stream.querySelectorAll('.ln:not(#cursor-line)').length>60)stream.querySelector('.ln').remove();
}

// ---- heartbeat ----
let lastSync=null;
const pad=n=>String(n).padStart(2,'0');
function heartbeat(){
  const now=new Date();
  // the bot runs on a */15 schedule (GitHub may start it a few minutes late)
  const next=new Date(now);next.setUTCSeconds(0,0);next.setUTCMinutes(Math.floor(now.getUTCMinutes()/15)*15+15);
  const left=Math.max(0,Math.floor((next-now)/1000));
  $('hb-next').textContent=pad(Math.floor(left/60))+':'+pad(left%60);
  if(lastSync){
    const a=Math.max(0,Math.floor((now-lastSync)/1000));
    $('hb-age').textContent=a<3600?pad(Math.floor(a/60))+'m '+pad(a%60)+'s':Math.floor(a/3600)+'h '+pad(Math.floor(a%3600/60))+'m';
  }
}
setInterval(heartbeat,1000);heartbeat();

// ---- data ----
async function load(){
  try{
    const r=await fetch('stats.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0; const d=await r.json();
    lastSync=new Date(d.updated);
    const hm=lastSync.toISOString().slice(11,16)+'Z';
    $('updated').textContent='SYNC '+lastSync.toISOString().slice(5,10)+' '+hm;
    $('hb-sync').textContent=hm;
    // accumulation
    const a=d.accumulation||{};
    $('acc-mode').textContent=(a.mode||'offline').toUpperCase();
    const ap=$('acc-pnl');ap.textContent=pctf(a.pnl_pct);ap.className='v '+pcls(a.pnl_pct);
    $('acc-buys').textContent=a.buys??'—';
    // real money: prices and percentages only — never quantities or £ held
    const coins=a.coins||{};
    $('acc-rows').replaceChildren(row([['COIN'],['AVG BUY','r'],['NOW','r'],['P/L','r'],['BUYS','r']],'h'),
      ...Object.entries(coins).map(([k,c])=>row([[k.split('-')[0]],[c.market===false?'no market':pxf(c.avg_price),'r'+(c.market===false?' mute':'')],
        [pxf(c.price),'r'],[pctf(c.pnl_pct),'r '+pcls(c.pnl_pct)],[String(c.buys??0),'r']])));
    const lb=a.last_buy?'last buy '+String(a.last_buy).slice(5,16).replace('T',' ')+'Z':'no fills yet';
    $('acc-status').replaceChildren(...[a.status||'standing by',lb].map(l=>Object.assign(document.createElement('div'),{textContent:l})));
    // daytrade
    const t=d.daytrade||{};
    $('dt-mode').textContent=$('feed-mode').textContent=(t.mode||'paper').toUpperCase();
    const net=t.net_pnl_after_fees??t.realized_pnl_gbp??0,gr=t.gross_pnl_gbp??0;
    const pnl=$('dt-pnl');pnl.textContent=gbp(net);pnl.className='v '+(net<0?'neg':'pos');
    const gp=$('dt-gross');gp.textContent=gbp(gr);gp.className='v '+(gr<0?'neg':'pos');
    $('dt-wr').textContent=t.trades?Math.round((t.win_rate||0)*100)+'% ('+(t.wins||0)+'/'+t.trades+')':'—';
    $('dt-trades').textContent=t.trades??'—';
    $('dt-pair').textContent=t.pair||'ETH-GBP';
    $('dt-price').textContent=t.last_price?pxf(t.last_price):'£—';
    const dep=(t.invested_gbp||0),pot=(t.pot_gbp||20),pct=Math.min(100,Math.round(dep/pot*100));
    $('dt-potbar').style.width=pct+'%';
    $('dt-potlbl').textContent='POT '+gbp(pot)+' · DEPLOYED '+gbp(dep)+' · CASH '+gbp(t.cash_gbp??pot-dep)
      +' · '+(t.tranches_open||0)+'/'+(t.tranches_total||4)+' SLOTS';
    const p2=n=>(Number(n)*100).toFixed(2)+'%';
    $('dt-fees').textContent=t.fee_rate!=null?'MAKER FEE '+p2(t.fee_rate)+'/SIDE · TP FLOOR '+p2(t.effective_tp)
      +' · BUY ON -'+p2(t.buy_dip_pct||0)+' DIP':'';
    const tr=t.open_tranches||[];
    $('dt-rows').replaceChildren(...(tr.length?[row([['ENTRY'],['NOW','r'],['UNREAL.','r'],['SELL ≥','r']],'dt h'),
      ...tr.map(x=>row([[pxf(x.entry)+(x.status!=='held'?' ·'+x.status.replace('_',' '):'')],[pxf(t.last_price),'r'],
        [pctf(x.unrealised_pct),'r '+pcls(x.unrealised_pct)],[pxf(x.target),'r']],'dt'))]
      :[row([['no open tranches — waiting for a dip','mute full']],'dt')]));
    const g=$('dt-guard');
    if(t.losing_streak!=null){
      g.hidden=false;g.classList.toggle('on',!!t.cooldown_active);
      g.textContent=t.cooldown_active
        ?'⚠ COOLDOWN · '+t.losing_streak+' LOSING DAYS · NO NEW BUYS UNTIL '+String(t.cooldown_until).slice(5,16).replace('T',' ')+'Z'
        :'SAFEGUARD OK · LOSING STREAK '+t.losing_streak+'/'+(t.max_losing_streak||2)+' · TRADING NORMALLY';
    }
    $('dt-log').replaceChildren(...(t.journal&&t.journal.length?t.journal:['no trades yet']).slice(-8)
      .map(l=>Object.assign(document.createElement('div'),{textContent:String(l)})));
    $('foot').textContent='WMBOT TERMINAL · ACCUMULATION '+(a.mode||'offline').toUpperCase()
      +' · DAY-TRADE '+(t.mode||'paper').toUpperCase()+' · PERCENTAGES ONLY FOR REAL FUNDS';
    enqueue(d.thoughts&&d.thoughts.length?d.thoughts:['awaiting first reasoning run…']);
    heartbeat();
  }catch(e){
    $('updated').innerHTML='<span class="err">NO SIGNAL — awaiting first bot run</span>';
    enqueue(['link down — retrying in 60s…']);
  }
}
enqueue(['boot sequence · WMBOT terminal online','establishing uplink to stats feed…']);
load();setInterval(load,60000);
</script>
</body>
</html>
